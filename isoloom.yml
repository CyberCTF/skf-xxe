# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF XML External Entity Injection (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask (Python 2) endpoint that parses submitted XML with external entities expanded (XXE). The SKF lab folder python/XXE is
# vendored unchanged in app/ and built by its own Dockerfile through an overlay
# (build/web/Dockerfile) that adds the flag folder /ctf.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-xxe

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.60.138.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: app
      dockerfile: build/web/Dockerfile
      init: [ctf/flag.sh]

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: XML posted to /home is parsed and its items element echoed
    script: checks/xml.sh

message: |
  OWASP SKF XML External Entity Injection answers at http://localhost:{{ machines.web.services.0.publish }}/.
  The form posts XML to /home and the <items> element comes back. What else can an XML document declare?
